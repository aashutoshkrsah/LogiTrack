spring.application.name=logistics-tracking-system
server.port=${SERVER_PORT:8080}

# MySQL 8.0 Database Configuration (Use environment variables for credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logistics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Jackson ISO Date/Time Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


# JWT Authentication (demo users seeded from env; change the secret + passwords in production)
app.jwt.secret=${JWT_SECRET:LogiTrackDevSecretKey-ChangeMeInProduction-0123456789abcdef}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.auth.admin-email=${APP_AUTH_ADMIN_EMAIL:admin@logitrack.in}
app.auth.admin-password=${APP_AUTH_ADMIN_PASSWORD:Admin@123}
app.auth.admin-name=${APP_AUTH_ADMIN_NAME:Admin User}
app.auth.dispatcher-email=${APP_AUTH_DISPATCHER_EMAIL:dispatcher@logitrack.in}
app.auth.dispatcher-password=${APP_AUTH_DISPATCHER_PASSWORD:Dispatch@123}
app.auth.dispatcher-name=${APP_AUTH_DISPATCHER_NAME:Dispatch Operator}
app.auth.viewer-email=${APP_AUTH_VIEWER_EMAIL:viewer@logitrack.in}
app.auth.viewer-password=${APP_AUTH_VIEWER_PASSWORD:View@123}
app.auth.viewer-name=${APP_AUTH_VIEWER_NAME:Read-only Viewer}

# Actuator health (public) — other actuator endpoints stay disabled by default
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
