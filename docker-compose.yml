# LogiTrack — full stack with Docker Compose.
#   docker compose up --build
#   Frontend: http://localhost:4200   Backend: http://localhost:8080/api
#   MySQL:    localhost:3306 (logistics_db)
# Copy .env.example to .env and set DB_PASSWORD / JWT_SECRET before first run.
services:
  mysql:
    image: mysql:8.0
    container_name: logitrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-logitrack_root}
      MYSQL_DATABASE: logistics_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-logitrack_root}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: logitrack-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/logistics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-logitrack_root}
      JWT_SECRET: ${JWT_SECRET:-LogiTrackDevSecretKey-ChangeMeInProduction-0123456789abcdef}
      APP_AUTH_ADMIN_PASSWORD: ${APP_AUTH_ADMIN_PASSWORD:-Admin@123}
      APP_AUTH_DISPATCHER_PASSWORD: ${APP_AUTH_DISPATCHER_PASSWORD:-Dispatch@123}
      APP_AUTH_VIEWER_PASSWORD: ${APP_AUTH_VIEWER_PASSWORD:-View@123}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: logitrack-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
